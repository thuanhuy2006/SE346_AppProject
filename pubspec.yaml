name: kanji_summoner
description: "Learning Japanese"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_tts: ^4.2.5
  vibration: ^3.1.6
  google_mlkit_digital_ink_recognition: ^0.14.2
  video_player: ^2.8.6
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  record: 6.2.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  speech_to_text: ^7.3.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/gifs/
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/AppHocTiengNhat.png"
